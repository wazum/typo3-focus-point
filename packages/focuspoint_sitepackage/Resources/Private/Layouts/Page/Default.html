<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <f:render section="headerAssets" optional="true" />
    <title>{page.title} — Focus Point Demo</title>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>TYPO3 Focus Point Demo</h1>
            <p class="subtitle">
                <code>object-fit: cover</code> + <code>object-position</code> = no extension needed
            </p>
        </div>
    </header>
    <main class="container">
        <f:render section="content" />
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>Focus area values computed by
                <code>FocusPositionViewHelper</code> — zero JavaScript.</p>
        </div>
    </footer>
</body>
</html>
</html>
